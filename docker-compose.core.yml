# 核心服务：btc-board + server + web
# MySQL / Redis URL 用 server/.env（或测试的 server/.env.test）
# 立即采集：server 容器内跑 collect.py（挂载 scripts/tennis-monitor）；9004 可选（live/定时）
#
# 测试（不启 compose redis，用 .env 里的外部 REDIS_URL）:
#   bash scripts/docker-deploy.sh test up -d --build
# 生产（默认启 with-redis）:
#   bash scripts/docker-deploy.sh prod up -d --build

name: ${COMPOSE_PROJECT_NAME:-yuce}

services:
  redis:  # 仅生产等需要时启用（COMPOSE_PROFILES=with-redis）；测试用外部 Redis
    profiles: ["with-redis"]
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy allkeys-lru
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-9014}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  server:  # Node API；挂载 collect.py，点击采集不依赖 9004
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 512m
    env_file:
      - ${SERVER_ENV_FILE:-./server/.env}
    environment:
      PORT: 3001
      APP_ENV: ${APP_ENV:-production}
      SOFA_MONITOR_ENV_FILE: ${SOFA_MONITOR_ENV_FILE:-}
      # 生产 deploy/prod.env 设 COMPOSE_REDIS_URL=redis://redis:6379；DB 始终读 env_file
      REDIS_URL: ${COMPOSE_REDIS_URL:-}
      TENNIS_MONITOR_DIR: /tennis-monitor
      TENNIS_PYTHON: python3
      PYTHONUNBUFFERED: "1"
      DOCKS_DIR: /docks
      DOCKS_BY_DAY_DIR: /tmp/docks_by_day_500
      BOARD_PRODUCT_URL: ${BOARD_PRODUCT_URL:-http://btc-board:8890/}
      SOFA_MONITOR_URL: ${SOFA_MONITOR_URL:-http://172.17.0.1:9004}
      # 五引擎（P6）；services 在 deploy/docker-compose.services.yml，默认经宿主机端口
      SCHEDULER_URL: ${SCHEDULER_URL:-http://host.docker.internal:9105}
      COLLECT_URL: ${COLLECT_URL:-http://host.docker.internal:9101}
      RULES_URL: ${RULES_URL:-http://host.docker.internal:9102}
      BETTING_URL: ${BETTING_URL:-http://host.docker.internal:9103}
      STOP_LOSS_URL: ${STOP_LOSS_URL:-http://host.docker.internal:9104}
    volumes:
      - ./scripts/tennis-monitor:/tennis-monitor:rw
      - ./docks:/docks:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      btc-board:
        condition: service_started
      redis:
        condition: service_healthy
    expose:
      - "3001"

  btc-board:  # Python 链上 UP/DOWN 排行榜 + 8890
    build:
      context: ./btc-board
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m
    env_file:
      - ${SERVER_ENV_FILE:-./server/.env}
    environment:
      FILTER_MARKET_MAKERS: ${FILTER_MARKET_MAKERS:-true}
      STREAK_MIN_ROUNDS: ${STREAK_MIN_ROUNDS:-3}
      PYTHONUTF8: "1"
      APP_ENV: ${APP_ENV:-production}
    volumes:
      - board_data:/app/持仓
    expose:
      - "8890"
    ports:
      - "${BOARD_PORT:-8890}:8890"

  web:  # Vue 静态站 + 反代 /api → server
    build:
      context: ./client
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    ports:
      - "${WEB_PORT:-9001}:80"
    depends_on:
      - server

volumes:
  board_data:
  redis_data:
