# 核心服务：btc-board + server + web
# MySQL 用 server/.env 远程库；Redis 映射 127.0.0.1:9014（9003 留给 btc5m-web）
# 立即采集：server 容器内跑 collect.py（挂载 scripts/tennis-monitor）；9004 可选（live/定时）
# 用法: docker compose -f docker-compose.core.yml up -d --build

name: yuce

services:
  redis:  # 网球 bundle / live 缓存
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy allkeys-lru
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:9014:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  server:  # Node API；挂载 collect.py，点击采集不依赖 9004
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 512m
    env_file:
      - ./server/.env
    environment:
      PORT: 3001
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TENNIS_MONITOR_DIR: /tennis-monitor
      PYTHONUNBUFFERED: "1"
      BOARD_PRODUCT_URL: ${BOARD_PRODUCT_URL:-http://btc-board:8890/}
      SOFA_MONITOR_URL: ${SOFA_MONITOR_URL:-http://172.17.0.1:9004}
    volumes:
      - ./scripts/tennis-monitor:/tennis-monitor:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      btc-board:
        condition: service_started
    expose:
      - "3001"

  btc-board:  # Python 链上 UP/DOWN 排行榜 + 8890
    build:
      context: ./btc-board
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m
    env_file:
      - ./server/.env
    environment:
      FILTER_MARKET_MAKERS: ${FILTER_MARKET_MAKERS:-true}
      STREAK_MIN_ROUNDS: ${STREAK_MIN_ROUNDS:-3}
      PYTHONUTF8: "1"
    volumes:
      - board_data:/app/持仓
    expose:
      - "8890"
    ports:
      - "${BOARD_PORT:-8890}:8890"

  web:  # Vue 静态站 + 反代 /api → server
    build:
      context: ./client
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    ports:
      - "${WEB_PORT:-9001}:80"
    depends_on:
      - server

volumes:
  board_data:
  redis_data:
