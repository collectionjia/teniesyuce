# 使用外部 MySQL（独立配置，推荐）
# 用法: docker compose -f docker-compose.external.yml up -d --build
#
# 网球 Top20 / Polymarket / 赛程：统一由宿主机 Sofascore 监控 (9004) 采集写入 MySQL
# server 通过 SOFA_MONITOR_URL 拉取进行中比分；不再使用 tennis:8765 容器

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-tennisv2}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 3001
      INIT_ADMIN: ${INIT_ADMIN:-0}
      ADMIN_ACCOUNT: ${ADMIN_ACCOUNT:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-管理员}
      MUSKPAY_API_BASE: ${MUSKPAY_API_BASE:-https://apitest.nihaopay.com}
      MUSKPAY_MERCHANT_ID: ${MUSKPAY_MERCHANT_ID:-}
      MUSKPAY_BEARER_TOKEN: ${MUSKPAY_BEARER_TOKEN:-}
      MUSKPAY_VENDOR: ${MUSKPAY_VENDOR:-alipay}
      MUSKPAY_USD_RATE: ${MUSKPAY_USD_RATE:-0.14}
      MUSKPAY_WEBSITE: ${MUSKPAY_WEBSITE:-http://localhost}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      BOARD_PRODUCT_URL: ${BOARD_PRODUCT_URL:-http://board:8890/}
      NBA_INTERNAL_URL: ${NBA_INTERNAL_URL:-http://basketball:8780}
      DOTA2_INTERNAL_URL: ${DOTA2_INTERNAL_URL:-http://dota2:8781}
      NBA_PRODUCT_URL: ${NBA_PRODUCT_URL:-http://basketball:8780/}
      DOTA2_PRODUCT_URL: ${DOTA2_PRODUCT_URL:-http://dota2:8781/}
      SOFA_MONITOR_URL: ${SOFA_MONITOR_URL:-http://172.17.0.1:9004}
      SOFA_MONITOR_TOKEN: ${SOFA_MONITOR_TOKEN:-sofascore-monitor-2026}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TENNIS_CACHE_TTL_SEC: ${TENNIS_CACHE_TTL_SEC:-86400}
    depends_on:
      redis:
        condition: service_healthy
      board:
        condition: service_started
      basketball:
        condition: service_started
      dota2:
        condition: service_started
    expose:
      - "3001"

  board:
    build:
      context: ./board
    restart: unless-stopped
    environment:
      ALCHEMY_KEY: ${ALCHEMY_KEY:-}
      FILTER_MARKET_MAKERS: ${FILTER_MARKET_MAKERS:-true}
      STREAK_MIN_ROUNDS: ${STREAK_MIN_ROUNDS:-3}
      CRAWL_ENABLED: ${CRAWL_ENABLED:-true}
      PYTHONUTF8: "1"
    volumes:
      - board_data:/app/持仓
    expose:
      - "8890"
    ports:
      - "${BOARD_PORT:-8890}:8890"

  basketball:
    build:
      context: ./basketball
    restart: unless-stopped
    environment:
      PORT: "8780"
      POLY_TAG_SLUG: nba
      POLY_SERIES_ID: "10345"
      SPORT_LABEL: NBA
      CACHE_PATH: /app/data/cache.json
      REFRESH_SEC: ${NBA_REFRESH_SEC:-60}
      PYTHONUTF8: "1"
    volumes:
      - basketball_data:/app/data
    expose:
      - "8780"
    ports:
      - "${NBA_PORT:-8780}:8780"

  dota2:
    build:
      context: ./dota2
    restart: unless-stopped
    environment:
      PORT: "8781"
      POLY_TAG_SLUG: dota-2
      SPORT_LABEL: DOTA2
      CACHE_PATH: /app/data/cache.json
      REFRESH_SEC: ${DOTA2_REFRESH_SEC:-60}
      PYTHONUTF8: "1"
    volumes:
      - dota2_data:/app/data
    expose:
      - "8781"
    ports:
      - "${DOTA2_PORT:-8781}:8781"

  web:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - server

volumes:
  board_data:
  redis_data:
  basketball_data:
  dota2_data:
