# 五引擎服务（build context = services/）
# 部署顺序：先 core（docker-compose.core.yml），再本文件
#   bash scripts/docker-deploy-services.sh up -d --build
# server 容器通过 deploy/prod.env 的 SCHEDULER_URL=http://host.docker.internal:9105 连接 scheduler
# 各服务 .env 需与 server/.env 共用 DB_* / REDIS_URL（可复制 server/.env 后改 PORT）

name: yuce-services

services:
  collect:
    profiles: ["collect", "all"]
    build:
      context: ../services
      dockerfile: collect/Dockerfile
    restart: unless-stopped
    env_file:
      - ../services/collect/.env
    environment:
      PORT: 9101
    ports:
      - "127.0.0.1:9101:9101"

  rules:
    profiles: ["rules", "all"]
    build:
      context: ../services
      dockerfile: rules/Dockerfile
    restart: unless-stopped
    env_file:
      - ../services/rules/.env
    environment:
      PORT: 9102
    ports:
      - "127.0.0.1:9102:9102"

  betting:
    profiles: ["betting", "all"]
    build:
      context: ../services
      dockerfile: betting/Dockerfile
    restart: unless-stopped
    env_file:
      - ../services/betting/.env
    environment:
      PORT: 9103
    ports:
      - "127.0.0.1:9103:9103"

  stop-loss:
    profiles: ["stop-loss", "all"]
    build:
      context: ../services
      dockerfile: stop-loss/Dockerfile
    restart: unless-stopped
    env_file:
      - ../services/stop-loss/.env
    environment:
      PORT: 9104
    ports:
      - "127.0.0.1:9104:9104"

  scheduler:
    profiles: ["scheduler", "all"]
    build:
      context: ../services
      dockerfile: scheduler/Dockerfile
    restart: unless-stopped
    env_file:
      - ../services/scheduler/.env
    environment:
      PORT: 9105
      COLLECT_URL: http://collect:9101
      RULES_URL: http://rules:9102
      BETTING_URL: http://betting:9103
      STOP_LOSS_URL: http://stop-loss:9104
    ports:
      - "127.0.0.1:9105:9105"
