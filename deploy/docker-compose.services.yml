# 五引擎 Docker（与 yuce-prod core 同机；server 经 host.docker.internal:910x 访问）
#   bash scripts/docker-deploy-services.sh up -d --build
# 依赖：server/.env 已配置；server/ 下已 npm install（挂载 node_modules）

name: yuce-services

networks:
  yuce-prod:
    external: true
    name: yuce-prod_default

x-service-common: &service-common
  restart: unless-stopped
  env_file:
    - ../server/.env
  networks:
    - yuce-prod
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &service-env
    SERVER_ROOT: /server
    ENV_FILE: /server/.env
    NODE_PATH: /server/node_modules
    REDIS_URL: redis://redis:6379
  volumes:
    - ../server:/server:ro

services:
  collect:
    profiles: ["collect", "all"]
    <<: *service-common
    build:
      context: ..
      dockerfile: services/collect/Dockerfile
    environment:
      <<: *service-env
      PORT: 9101
      TENNIS_MONITOR_DIR: /tennis-monitor
      TENNIS_PYTHON: python3
      DOCKS_DIR: /docks
    volumes:
      - ../server:/server:ro
      - ../scripts/tennis-monitor:/tennis-monitor:ro
      - ../scripts/tennis-monitor/logs:/tennis-monitor/logs:rw
      - ../scripts/tennis-monitor/output:/tennis-monitor/output:rw
      - ../docks:/docks:ro
    ports:
      - "127.0.0.1:9101:9101"

  rules:
    profiles: ["rules", "all"]
    <<: *service-common
    build:
      context: ..
      dockerfile: services/rules/Dockerfile
    environment:
      <<: *service-env
      PORT: 9102
    ports:
      - "127.0.0.1:9102:9102"

  betting:
    profiles: ["betting", "all"]
    <<: *service-common
    build:
      context: ..
      dockerfile: services/betting/Dockerfile
    environment:
      <<: *service-env
      PORT: 9103
    ports:
      - "127.0.0.1:9103:9103"

  stop-loss:
    profiles: ["stop-loss", "all"]
    <<: *service-common
    build:
      context: ..
      dockerfile: services/stop-loss/Dockerfile
    environment:
      <<: *service-env
      PORT: 9104
    ports:
      - "127.0.0.1:9104:9104"

  scheduler:
    profiles: ["scheduler", "all"]
    <<: *service-common
    build:
      context: ..
      dockerfile: services/scheduler/Dockerfile
    environment:
      <<: *service-env
      PORT: 9105
      EXECUTOR_MODE: http
      SCHEDULER_LOOP_ENABLED: "1"
      COLLECT_URL: http://collect:9101
      RULES_URL: http://rules:9102
      BETTING_URL: http://betting:9103
      STOP_LOSS_URL: http://stop-loss:9104
    ports:
      - "127.0.0.1:9105:9105"
