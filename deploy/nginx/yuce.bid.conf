# www.yuce.bid — 宿主机 Nginx → Docker web:9001（内含 /api → server:3001）
# 证书路径由 certbot 生成后生效（见 setup-yuce-ssl.sh）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# apex → www
server {
    listen 80;
    listen [::]:80;
    server_name yuce.bid;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.yuce.bid$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.yuce.bid;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.yuce.bid$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yuce.bid;

    ssl_certificate     /etc/letsencrypt/live/yuce.bid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuce.bid/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.yuce.bid$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yuce.bid;

    ssl_certificate     /etc/letsencrypt/live/yuce.bid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuce.bid/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
